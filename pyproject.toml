[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ling-mapper"
version = "0.1.0"
description = "Dataset-independent records and traceable discourse annotation import"
requires-python = ">=3.10"

[project.scripts]
ling-prepare = "argument_graph.prepare_data:main"

[tool.setuptools.packages.find]
where = ["src"]
